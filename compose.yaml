services:
  coffee-snark:
    build: .
    image: coffee-snark:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      COFFEE_TIMEZONE: Europe/Copenhagen
      HISTORY_DB: /data/history.sqlite3
    volumes:
      - coffee-history:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 1.0

volumes:
  coffee-history:
