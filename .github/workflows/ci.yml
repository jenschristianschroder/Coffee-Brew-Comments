name: Test Docker service

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COFFEE_PORT: "8004"
      BASE_URL: http://127.0.0.1:8004
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test -t coffee-snark-test .
      - name: Test model and API
        run: docker run --rm coffee-snark-test
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start production container
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Exercise real HTTP endpoint
        run: python3 tests/smoke_http.py
      - name: Switch to classic model using the existing history
        env:
          COFFEE_MODEL_VARIANT: classic
        run: docker compose up -d --force-recreate --wait --wait-timeout 60
      - name: Exercise classic model HTTP endpoint
        env:
          EXPECTED_MODEL_VARIANT: classic
        run: python3 tests/smoke_http.py
      - name: Container diagnostics
        if: always()
        run: docker compose logs && docker compose down -v
